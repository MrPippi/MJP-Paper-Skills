// Compiles every skill template against one Minecraft version's Paper dev bundle.
//
//   node ../scripts/extract-skill-java.mjs 26.3 && ./gradlew compileSkills -Pmc=26.3
//   node ../scripts/extract-skill-java.mjs 1.21.11 && ./gradlew compileSkills -Pmc=1.21.11
//
// Each skill gets one source set per compile set written by the extractor
// (build/extracted/<mc>/<group>/<skill>/<skill|examples>/), compiled in isolation
// against the dev bundle plus the soft dependencies listed in Skills/paper-api/PLATFORM.md.
// Paper API skills are also compiled against the dev bundle (a superset of paper-api);
// the extractor rejects NMS imports in them separately.

plugins {
    id 'java'
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.24'
}

def targets = [
    '26.3'   : [bundle: '26.3.build.258-stable', java: 25],
    '1.21.11': [bundle: '1.21.11-R0.1-SNAPSHOT', java: 21],
]
def mc = providers.gradleProperty('mc').getOrElse('26.3')
def target = targets[mc]
if (target == null) {
    throw new GradleException("Unknown -Pmc=${mc}; expected one of ${targets.keySet()}")
}
// -Pbundle=<version> compiles the same templates against another dev bundle
// (used by .github/workflows/skills-canary.yml with the newest published bundle).
def bundleOverride = providers.gradleProperty('bundle').orNull
if (bundleOverride) {
    target = target + [bundle: bundleOverride]
    logger.lifecycle("Using dev bundle ${bundleOverride} instead of the pinned ${targets[mc].bundle}")
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://jitpack.io' }                                  // VaultAPI
    maven { url = 'https://repo.extendedclip.com/releases/' }             // PlaceholderAPI
    maven { url = 'https://repo.codemc.io/repository/maven-releases/' }   // PacketEvents
    maven { url = 'https://repo.dmulloy2.net/repository/public/' }        // ProtocolLib
}

dependencies {
    paperweight.paperDevBundle(target.bundle)

    // Soft dependencies (versions from Skills/paper-api/PLATFORM.md)
    compileOnly('com.github.MilkBowl:VaultAPI:1.7.1') { transitive = false }
    compileOnly 'me.clip:placeholderapi:2.11.6'
    compileOnly 'com.github.retrooper:packetevents-spigot:2.13.0'
    compileOnly 'com.comphenix.protocol:ProtocolLib:5.3.0'
    compileOnly 'org.xerial:sqlite-jdbc:3.49.1.0'

    // Skills ship JUnit tests next to their templates
    compileOnly platform('org.junit:junit-bom:5.12.2')
    compileOnly 'org.junit.jupiter:junit-jupiter-api'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(target.java)
}

def extracted = layout.projectDirectory.dir("build/extracted/${mc}").asFile
def skillTasks = []

if (extracted.isDirectory()) {
    extracted.eachDir { group ->
        group.eachDir { skill ->
            skill.eachDir { set ->
                def name = "${skill.name}-${set.name}".replaceAll(/-(\w)/) { all, c -> c.toUpperCase() }
                def sourceSet = sourceSets.create(name) {
                    java.srcDirs = [set]
                    resources.srcDirs = []
                    compileClasspath += sourceSets.main.compileClasspath
                }
                tasks.named(sourceSet.compileJavaTaskName) {
                    options.encoding = 'UTF-8'
                    options.release.set(target.java)
                    options.compilerArgs += ['-Xlint:deprecation,removal']
                }
                skillTasks << sourceSet.compileJavaTaskName
            }
        }
    }
}

// Partial snippets are not compiled, so check that every class they import exists in this
// version's classpath (dev bundle, paper-api, soft dependencies). The list comes from the extractor.
tasks.register('checkSnippetImports') {
    group = 'verification'
    description = "Checks that the imports of partial snippets resolve for Minecraft ${mc}."
    def listFile = layout.projectDirectory.file("build/extracted/${mc}/snippet-imports.tsv").asFile
    def classpath = sourceSets.main.compileClasspath
    inputs.files(classpath)
    doLast {
        if (!listFile.isFile()) {
            throw new GradleException("No snippet list for ${mc}. Run: node ../scripts/extract-skill-java.mjs ${mc}")
        }
        def classes = new HashSet<String>()
        def packages = new HashSet<String>()
        def add = { String entry ->
            def name = entry.substring(0, entry.length() - '.class'.length())
            classes << name
            def slash = name.lastIndexOf('/')
            if (slash > 0) packages << name.substring(0, slash)
        }
        classpath.files.each { f ->
            if (f.isDirectory()) {
                f.eachFileRecurse(groovy.io.FileType.FILES) { c ->
                    if (c.name.endsWith('.class')) add(f.toPath().relativize(c.toPath()).toString().replace('\\', '/'))
                }
            } else if (f.name.endsWith('.jar')) {
                new java.util.zip.ZipFile(f).withCloseable { zip ->
                    zip.entries().each { e -> if (e.name.endsWith('.class')) add(e.name) }
                }
            }
        }
        // a.b.C.D may be the nested class a/b/C$D: try every split between package and class
        def resolves = { String dotted ->
            def parts = dotted.split('\\.')
            (parts.length - 1..1).any { i -> classes.contains(parts[0..<i].join('/') + '/' + parts[i..-1].join('$')) }
        }
        def missing = []
        listFile.eachLine('UTF-8') { line ->
            if (!line.trim()) return
            def (where, kind, name) = line.split('\t')
            def ok
            if (kind == 'static') {
                def owner = name.substring(0, name.lastIndexOf('.'))     // drop the member or *
                ok = resolves(owner)
            } else if (name.endsWith('.*')) {
                def base = name[0..-3]
                ok = packages.contains(base.replace('.', '/')) || resolves(base)
            } else {
                ok = resolves(name)
            }
            if (!ok) missing << "${where}: ${name}"
        }
        if (missing) {
            throw new GradleException("Snippet imports not found for Minecraft ${mc}:\n  " + missing.unique().join('\n  '))
        }
        logger.lifecycle("All snippet imports resolve for Minecraft ${mc}.")
    }
}

// Plugin jars for the runtime checks on a real server (see runtime/runtime.gradle).
ext.skillsTarget = [mc: mc, java: target.java, extracted: extracted]
apply from: 'runtime/runtime.gradle'

tasks.register('compileSkills') {
    group = 'verification'
    description = "Compiles all extracted skill templates for Minecraft ${mc}."
    dependsOn skillTasks
    doFirst {
        if (skillTasks.isEmpty()) {
            throw new GradleException("Nothing extracted for ${mc}. Run: node ../scripts/extract-skill-java.mjs ${mc}")
        }
    }
}
